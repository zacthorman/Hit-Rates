<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football hit rates</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --page: #f9f9f7; --raised: #ffffff;
  --text: #0b0b0b; --muted: #77756f;
  --border: rgba(11,11,11,0.10); --grid: #e8e7e1;
  --link: #2a78d6; --accent: #0b0b0b; --on-accent: #ffffff;
  --today: #c2410c;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #1a1a19; --page: #0d0d0d; --raised: #232322;
    --text: #ffffff; --muted: #8f8d87;
    --border: rgba(255,255,255,0.12); --grid: #2c2c2a;
    --link: #5ba3f5; --accent: #ffffff; --on-accent: #0b0b0b;
    --today: #fb923c;
  }
}
* { box-sizing: border-box; }
.bar { display: flex; align-items: center; gap: 10px; margin: 20px 0 12px;
       flex-wrap: wrap; }
.sports { display: flex; gap: 4px; background: var(--grid); padding: 3px;
          border-radius: 9px; }
.sports button { border: 0; background: none; padding: 7px 16px; border-radius: 7px;
                 font: inherit; font-weight: 600; font-size: 0.88rem;
                 color: var(--muted); cursor: pointer; }
.sports button[aria-pressed="true"] { background: var(--raised); color: var(--text);
                                      box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
a.picks-btn { text-decoration: none; display: inline-flex; align-items: center; }
.picks-btn { margin-left: auto; border: 1px solid var(--border); background: var(--raised);
             color: var(--text); padding: 7px 14px; border-radius: 7px; font: inherit;
             font-size: 0.85rem; font-weight: 600; cursor: pointer; }
.picks-btn[aria-expanded="true"] { background: var(--accent); color: var(--on-accent);
                                   border-color: var(--accent); }
.picks { display: grid; gap: 10px; margin: 0 0 22px;
         grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.pick { background: var(--raised); border: 1px solid var(--border);
        border-radius: 10px; padding: 13px 15px; font-size: 0.9rem; }
.pick h2 { font-size: 0.68rem; letter-spacing: 0.07em; text-transform: uppercase;
           color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.pick .sel { font-size: 0.97rem; font-weight: 600; line-height: 1.35; }
.pick .where { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
.pick .odds { margin-top: 8px; }
.pick .odds b { font-size: 1.05rem; }
.pick ol { margin: 7px 0 0; padding-left: 17px; font-size: 0.85rem; line-height: 1.45; }
.pick details { margin-top: 9px; }
.pick summary { color: var(--muted); font-size: 0.78rem; cursor: pointer;
                list-style: none; }
.pick summary::-webkit-details-marker { display: none; }
/* Drawn rather than typed. The chevron characters rendered as a missing-glyph
   box on a machine without the font, and a marker that might not exist is
   worse than one made of borders, which always does. */
.pick summary::before { content: ""; display: inline-block; width: 0; height: 0;
  border-left: 4px solid currentColor; border-top: 3.5px solid transparent;
  border-bottom: 3.5px solid transparent; margin-right: 6px;
  transform-origin: 30% 50%; transition: transform 0.15s ease; }
.pick details[open] summary::before { transform: rotate(90deg); }
.pick details p { color: var(--muted); font-size: 0.78rem; line-height: 1.45;
                  margin: 6px 0 0; }
.pick .flag { color: var(--today); font-weight: 600; }
.pick.none { color: var(--muted); }
body {
  margin: 0; padding: 34px 18px 60px;
  background: var(--page); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; }
h1 { font-size: 27px; font-weight: 660; margin: 0 0 5px; letter-spacing: -0.015em; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

/* Filters. Sticky, because on a phone the list is long and the filter is
   the thing you reach for after scrolling, not before. */
.filters {
  position: sticky; top: 0; z-index: 5;
  background: var(--page); padding: 10px 0 12px;
  margin: 0 0 6px; border-bottom: 1px solid var(--border);
  display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
}
.chip {
  appearance: none; cursor: pointer;
  background: var(--raised); color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 7px 13px; font: inherit; font-size: 13.5px; font-weight: 550;
  white-space: nowrap;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
}
.chip .n { opacity: 0.55; margin-left: 5px; font-weight: 500; }
.search {
  flex: 1 1 150px; min-width: 130px;
  background: var(--raised); color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 7px 13px; font: inherit; font-size: 13.5px;
}
.search::placeholder { color: var(--muted); }

.day {
  margin: 22px 0 8px; font-size: 13px; font-weight: 640;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
}
.day.soon { color: var(--today); }

ul { list-style: none; margin: 0; padding: 0;
     background: var(--surface); border: 1px solid var(--border);
     border-radius: 11px; overflow: hidden; }
li { border-bottom: 1px solid var(--grid); }
li:last-child { border-bottom: 0; }
li a {
  display: flex; align-items: baseline; gap: 12px;
  padding: 13px 16px; color: inherit; text-decoration: none;
}
li a:hover { background: var(--raised); }
.time {
  flex: 0 0 46px; font-variant-numeric: tabular-nums;
  font-weight: 620; font-size: 14.5px; color: var(--text);
}
.match { flex: 1 1 auto; min-width: 0; }
.teams { font-weight: 560; color: var(--link); }
.meta { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.tag {
  display: inline-block; font-size: 11px; font-weight: 600;
  padding: 1px 6px; border-radius: 5px; margin-left: 6px;
  border: 1px solid var(--border); color: var(--muted);
}
li.played { opacity: 0.5; }

.empty { padding: 26px 16px; color: var(--muted); text-align: center; }
footer { margin-top: 26px; color: var(--muted); font-size: 12.5px; }
</style>
</head>

.6777875905176174,"evidence":0.2537781703934222,"crossLeague":false},"parlay":{"fixture":{"id":16184624,"home":"Buffalo Bills","away":"New England Patriots","competition":"NFL","kickoff":1791133200,"report":"nfl.html"},"legs":[{"team":"New England Patriots","player":"TreVeyon Henderson","position":"RB","stat":"Rushing and receiving yards","threshold":35.0,"alt":true,"line":34.5,"over":true,"hits":13,"total":19,"fair":1.4615384615384615,"label":"TreVeyon Henderson 35+ rushing and receiving yards"},{"team":"New England Patriots","player":"Drake Maye","position":"QB","stat":"Passing and rushing yards","threshold":230.0,"alt":true,"line":229.5,"over":true,"hits":14,"total":20,"fair":1.4285714285714286,"label":"Drake Maye 230+ passing and rushing yards"},{"team":"New England Patriots","player":"Hunter Henry","position":"TE","stat":"Rushing and receiving yards","threshold":25.0,"alt":true,"line":24.5,"over":true,"hits":14,"total":20,"fair":1.4285714285714286,"label":"Hunter Henry 25+ rushing and receiving yards"},{"team":"New England Patriots","player":"Rhamondre Stevenson","position":"RB","stat":"Receiving receptions","threshold":2.0,"alt":true,"line":1.5,"over":true,"hits":12,"total":17,"fair":1.4166666666666665,"label":"Rhamondre Stevenson 2+ receiving receptions"}],"sides":[{"team":"New England Patriots","hits":5,"total":16}],"fair":3.2,"naive":4.225536368393511,"need":7.059935651027261,"evidence":0.14164435051961052,"crossTeam":false,"crossLeague":false,"adjusted":0.07937955008380139,"z":3.4494173109502064,"consideredGroups":89}}]}};

let competition = "all";
let query = "";
let sport = null;          // set on first render to whichever has most fixtures

const SPORT_LABELS = { "football": "Football", "american-football": "NFL", "basketball": "Basketball", "darts": "Darts" };

/* Sports present, busiest first. Two codes on one page need separating before
   anything else: the league chips, the fixture list and the picks all mean
   something different depending on which you are looking at. */
function sportsPresent() {
  const counts = {};
  DATA.fixtures.forEach(f => {
    const key = f.sport || "football";
    counts[key] = (counts[key] || 0) + 1;
  });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

/* Day headings read better as "Today" and "Tomorrow" than as a date, and the
   comparison has to be on calendar days in the reader's own timezone rather
   than on a 24 hour difference: a match at 20:00 tonight and one at 12:00
   tomorrow are 16 hours apart but belong under different headings. */
function dayKey(ts) {
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function dayLabel(ts) {
  const d = new Date(ts * 1000);
  const today = new Date();
  const tomorrow = new Date();
  tomorrow.setDate(today.getDate() + 1);

  if (dayKey(ts) === dayKey(today.getTime() / 1000)) return "Today";
  if (dayKey(ts) === dayKey(tomorrow.getTime() / 1000)) return "Tomorrow";
  return d.toLocaleDateString(undefined,
    { weekday: "long", day: "numeric", month: "long" });
}

function timeLabel(ts) {
  if (!ts) return "TBC";
  return new Date(ts * 1000).toLocaleTimeString(undefined,
    { hour: "2-digit", minute: "2-digit", hour12: false });
}

function matches(f) {
  if (sport && (f.sport || "football") !== sport) return false;
  if (competition !== "all" && f.competition !== competition) return false;
  if (!query) return true;
  const hay = `${f.home} ${f.away} ${f.competition}`.toLowerCase();
  return hay.includes(query);
}

function renderSports() {
  const present = sportsPresent();
  if (!sport) sport = present.length ? present[0][0] : "football";

  const box = document.getElementById("sports");
  if (present.length < 2) { box.innerHTML = ""; return; }

  box.innerHTML = present.map(([key, n]) =>
    `<button type="button" data-sport="${escapeAttr(key)}"
      aria-pressed="${key === sport}">${escapeHtml(SPORT_LABELS[key] || key)}</button>`
  ).join("");

  box.querySelectorAll("[data-sport]").forEach(btn => {
    btn.addEventListener("click", () => {
      sport = btn.dataset.sport;
      competition = "all";
      renderSports();
      renderPicks();
      renderFilters();
      renderList();
    });
  });
}

function renderFilters() {
  // Only the leagues that belong to the sport on screen, so the row is four
  // chips rather than ten wrapping onto two lines with the NFL buried in it.
  const mine = DATA.fixtures.filter(f => (f.sport || "football") === sport);
  const comps = [...new Set(mine.map(f => f.competition))].sort();
  const counts = { all: mine.length };
  comps.forEach(c => {
    counts[c] = mine.filter(f => f.competition === c).length;
  });
  if (competition !== "all" && !comps.includes(competition)) competition = "all";

  const chips = ["all"].concat(comps).map(c => {
    const label = c === "all" ? "All" : c;
    return `<button type="button" class="chip" data-comp="${escapeAttr(c)}"
      aria-pressed="${c === competition}">${escapeHtml(label)}<span class="n">${counts[c]}</span></button>`;
  }).join("");

  document.getElementById("filters").innerHTML = chips +
    `<input class="search" id="search" type="search" placeholder="Search team"
      value="${escapeAttr(query)}" aria-label="Search team">`;

  document.querySelectorAll("[data-comp]").forEach(btn => {
    btn.addEventListener("click", () => {
      competition = btn.dataset.comp;
      renderFilters();
      renderList();
    });
  });

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    query = search.value.trim().toLowerCase();
    renderList();
  });
  if (query) {
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
  }
}

function renderList() {
  const shown = DATA.fixtures.filter(matches);
  const now = Date.now() / 1000;

  if (!shown.length) {
    document.getElementById("list").innerHTML =
      `<ul><li><div class="empty">Nothing to show. Build a new round with
       <code>python run.py --league "Premier League"</code>.</div></li></ul>`;
    return;
  }

  const groups = [];
  shown.forEach(f => {
    const key = f.kickoff ? dayKey(f.kickoff) : "tbc";
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.items.push(f);
    else groups.push({ key, ts: f.kickoff, items: [f] });
  });

  document.getElementById("list").innerHTML = groups.map(g => {
    const label = g.ts ? dayLabel(g.ts) : "Date to be confirmed";
    const soon = label === "Today" || label === "Tomorrow";
    const rows = g.items.map(f => {
      const played = f.kickoff && f.kickoff <= now;
      const tags = (f.players ? '<span class="tag">players</span>' : "")
                 + (f.adjusted ? '<span class="tag">adjusted</span>' : "");
      // ?v= is the build stamp. It changes every time the index is rebuilt,
      // so the browser is forced to fetch the report rather than serve a copy
      // it cached before the report was re-rendered. Without this a fixed
      // report looks unfixed for as long as the cache holds, which is the
      // most confusing possible failure.
      return `<li class="${played ? "played" : ""}">
        <a href="reports/${escapeAttr(f.report)}?v=${DATA.stamp}#e${f.id}">
          <span class="time">${timeLabel(f.kickoff)}</span>
          <span class="match">
            <span class="teams">${escapeHtml(f.home)} v ${escapeHtml(f.away)}</span>${tags}
            <span class="meta">${escapeHtml(f.competition)}${played ? " &middot; kicked off" : ""}</span>
          </span>
        </a></li>`;
    }).join("");
    return `<div class="day${soon ? " soon" : ""}">${escapeHtml(label)}</div>
            <ul>${rows}</ul>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "&#39;"); }

document.getElementById("footer").textContent =
  `Built ${DATA.built}. Each report is a snapshot: the numbers are frozen at ` +
  `the moment it was generated. Times are shown in your own timezone.`;

/* The picks, for whichever sport is on screen.

   Decided at build time, not in the browser: a pick of the week that moves
   when you nudge a slider is a search, not a pick. Kept behind a button
   because it is a sidebar to the fixture list, not the point of the page. */
const fmtOdds = v => (v === null || v === undefined || !isFinite(v))
  ? "—" : v.toFixed(2);

const half = p => p === "1ST" ? " (1st half)" : p === "2ND" ? " (2nd half)" : "";

function legText(l) {
  /* Alt lines read the way a book writes them. "50+ receiving yards" and
     "over 49.5 receiving yards" are the same bet, and only one of them is
     what you would go looking for on the coupon. */
  const market = l.alt
    ? `${l.threshold}+ ${l.stat.toLowerCase()}`
    : `${l.over ? "over" : "under"} ${l.line} ${l.stat.toLowerCase()}`;
  return l.player
    ? `${escapeHtml(l.player)} ${market}${half(l.period)}`
    : `${escapeHtml(l.team)} ${market}${half(l.period)}`;
}

function note(summary, body) {
  return `<details><summary>${summary}</summary><p>${body}</p></details>`;
}

function renderPicks() {
  const box = document.getElementById("picks");
  const all = DATA.picks && DATA.picks.sports;
  if (!box || !all) return;

  const p = all.find(x => x.sport === sport);
  const floor = DATA.picks.floor;
  const cards = [];

  if (p && p.single) {
    const s = p.single;
    cards.push(`<div class="pick">
      <h2>Best bet &middot; ${fmtOdds(floor)}+</h2>
      <div class="sel">${legText(s)}</div>
      <div class="where">${escapeHtml(s.fixture.home)} v ${escapeHtml(s.fixture.away)}</div>
      <div class="odds"><b>${s.hits}/${s.total}</b>${s.venue ? " " + s.venue : ""}
        &middot; fair <b>${fmtOdds(s.fair)}</b>, hold out for ${fmtOdds(s.need)}</div>
      ${note("how solid is this?",
        `Chosen from ${s.consideredGroups} separate questions this round, so the
         bar rises to match: a plain 95% floor of ${(s.evidence * 100).toFixed(0)}%
         becomes <span class="flag">${(s.adjusted * 100).toFixed(0)}%</span> once
         that searching is paid for. Asking for ${fmtOdds(floor)}+ caps the chance
         at 50%, so price and evidence pull against each other here.`)}
    </div>`);
  }

  if (p && p.double) {
    const d = p.double;
    cards.push(`<div class="pick">
      <h2>Evens double</h2>
      <div class="sel">2 legs &middot; ${fmtOdds(d.combined)}</div>
      <ol>${d.legs.map(l => `<li>${legText(l)} &mdash; ${l.hits}/${l.total},
        ${fmtOdds(l.fair)}<br><small>${escapeHtml(l.fixture.home)} v ${escapeHtml(l.fixture.away)}</small></li>`).join("")}</ol>
      ${note("why these two?",
        `The pair most likely to both land (about ${(d.joint * 100).toFixed(0)}% on the
         records) among doubles priced around evens. Counts and 0.5 lines are left
         out. ${d.sameGame ? "Both legs are in one game, so it goes on as a builder." :
         "Two different games, so neither leg rides on the other."}`)}
    </div>`);
  }

  if (p && p.banker) {
    const s = p.banker;
    cards.push(`<div class="pick">
      <h2>Banker</h2>
      <div class="sel">${legText(s)}</div>
      <div class="where">${escapeHtml(s.fixture.home)} v ${escapeHtml(s.fixture.away)}</div>
      <div class="odds"><b>${s.hits}/${s.total}</b> &middot; fair <b>${fmtOdds(s.fair)}</b>,
        hold out for ${fmtOdds(s.need)}</div>
      ${note("what is a banker?",
        `The best-supported single priced between 1.30 and 1.75, after allowing for
         how many bets were searched (${(s.adjusted * 100).toFixed(0)}% worst case).`)}
    </div>`);
  }

  if (p && p.acca) {
    const a = p.acca;
    cards.push(`<div class="pick">
      <h2>Best acca</h2>
      <div class="sel">${a.legs.length} legs &middot; ${fmtOdds(a.combined)}</div>
      <ol>${a.legs.map(l => `<li>${legText(l)} &mdash; ${l.hits}/${l.total},
        ${fmtOdds(l.fair)}</li>`).join("")}</ol>
      ${note("read this first",
        `One leg per match, so nothing rides twice on the same game.
         ${a.short ? `Short of the ${fmtOdds(a.target)} target &mdash; reaching it
         would have meant worse legs. ` : ""}These are fair prices, not offers: a
         book has to beat every one for the multiple to be worth taking, and the
         margin compounds with each leg.`)}
    </div>`);
  }

  if (p && p.builder) {
    const b = p.builder;
    const over = 100 * (b.naive / b.fair - 1);
    cards.push(`<div class="pick">
      <h2>Best builder</h2>
      <div class="sel">${escapeHtml(b.team)}</div>
      <div class="where">${escapeHtml(b.fixture.home)} v ${escapeHtml(b.fixture.away)}</div>
      <ol>${b.legs.map(l => `<li>${legText(l)} &mdash; ${l.hits}/${l.total}
        alone</li>`).join("")}</ol>
      <div class="odds">together <b>${b.hits}/${b.total}</b>
        &middot; fair <b>${fmtOdds(b.fair)}</b></div>
      ${note("why not just multiply the legs?",
        `Multiplying would say ${fmtOdds(b.naive)} &mdash;
         <span class="flag">${over.toFixed(0)}% longer than the record supports</span>.
         Same-team legs move together, so the product always flatters a builder.
         This is priced by counting the matches where every leg actually landed.`)}
    </div>`);
  }

  if (p && p.parlay) {
    const g = p.parlay;
    const gap = 100 * (g.naive / g.fair - 1);
    const sides = g.sides.map(s =>
      `${escapeHtml(s.team)} legs together <b>${s.hits}/${s.total}</b>`).join(" &middot; ");
    cards.push(`<div class="pick">
      <h2>Same-game parlay</h2>
      <div class="sel">${g.legs.length} legs &middot; ${fmtOdds(g.fair)}</div>
      <div class="where">${escapeHtml(g.fixture.home)} v ${escapeHtml(g.fixture.away)}</div>
      <ol>${g.legs.map(l => `<li>${legText(l)} &mdash; ${l.hits}/${l.total}
        alone</li>`).join("")}</ol>
      <div class="odds">${sides} &middot; fair <b>${fmtOdds(g.fair)}</b>,
        hold out for ${fmtOdds(g.need)}</div>
      ${note("how is this priced?",
        `Legs on the same team are counted together, out of the matches that
         carried all of them, so nothing assumes they are independent &mdash;
         multiplying them would have said ${fmtOdds(g.naive)}, ${gap >= 0
         ? `<span class="flag">${gap.toFixed(0)}% longer than the record supports</span>`
         : `${Math.abs(gap).toFixed(0)}% shorter than the record supports`}.
         ${g.crossTeam ? `The two sides share no matches outside a head to head,
         so their rates are multiplied rather than counted. Overs in one game
         drift up together with the pace, so that product slightly understates
         the real chance and quotes a price a shade longer than the truth.
         ` : ""}Lines are the biggest number each man clears at least 65% of the
         time, picked by fixing the rate and reading off the line rather than
         hunting the ladder for the rung that flatters him.`)}
    </div>`);
  }

  box.innerHTML = cards.length
    ? `<div class="picks">${cards.join("")}</div>`
    : `<div class="picks"><div class="pick none">Nothing cleared the bar for
       ${escapeHtml(SPORT_LABELS[sport] || sport)} this round.</div></div>`;
}

document.getElementById("picks-btn").addEventListener("click", e => {
  const box = document.getElementById("picks");
  const open = box.hidden;
  box.hidden = !open;
  e.currentTarget.setAttribute("aria-expanded", String(open));
});

renderSports();
renderPicks();
renderFilters();
renderList();
</script>
</body>
</html>
